; B-G431B-ESC1 + SimpleFOC - clean PlatformIO setup
;
; Replaces the Arduino IDE setup entirely. Everything that used to need a
; hal_conf_extra.h hack in Arduino IDE is a plain build_flag here.
;
; Two programs share the project; pick one with -e:
;   pio run -e closedloop -t upload   <- the actual motor control
;   pio run -e diagnostic -t upload   <- open-loop calibration measurements

[common]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino

; Serial (USART2 on PB3/PB4) is wired to the on-board ST-Link VCP, so the same
; USB cable that flashes the board is also the monitor port.
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem103
upload_port = /dev/cu.usbmodem103

; CRITICAL. SimpleFOC ships a weak fallback _configure6PWM() in
; drivers/hardware_specific/generic_mcu.cpp that unconditionally returns
; SIMPLEFOC_DRIVER_INIT_FAILED, alongside the real strong one in
; drivers/hardware_specific/stm32/stm32_mcu.cpp. Linked as a static archive the
; linker pulls generic_mcu.o first, the weak symbol satisfies the reference, and
; stm32_mcu.o is never pulled - so driver.init() returns 0 with NO diagnostic
; output whatsoever and the motor silently never moves. Linking the library as
; plain objects instead of an archive makes the strong symbol win.
lib_archive = no

lib_deps =
    askuric/Simple FOC@^2.4.0
    ; STM32HWEncoder (hardware quadrature on TIM4) lives here, not in core
    ; SimpleFOC. Its header guard is `#if defined(_STM32_DEF_)`, which the
    ; ststm32 Arduino framework satisfies on its own - the Arduino IDE
    ; "'STM32HWEncoder' does not name a type" error does not occur here.
    ; Currently unused: the encoder was measured to lose no counts.
    simplefoc/SimpleFOCDrivers@^1.0.9

build_flags =
    ; newlib-nano drops float support from printf() unless this is linked in.
    ; Without it a %f in Serial.printf() HardFaults instead of failing to build.
    -Wl,-u,_printf_float
    ; Required by SimpleFOC's LowsideCurrentSense on this board (the OPAMPs are
    ; the current-sense front end). Harmless while current sensing is unused.
    -D HAL_OPAMP_MODULE_ENABLED
    ; Makes the STM32 driver print its timer allocation and any init failure.
    ; Worth keeping on: a failed _configure6PWM() is otherwise totally silent
    ; and looks exactly like a motor that produces no torque.
    -D SIMPLEFOC_STM32_DEBUG

[env:closedloop]
extends = common
build_src_filter = +<closedloop.cpp>

[env:diagnostic]
extends = common
build_src_filter = +<diagnostic.cpp>

[env:mintest]
extends = common
build_src_filter = +<mintest.cpp>
